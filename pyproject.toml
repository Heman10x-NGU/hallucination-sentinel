[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hallucination-sentinel"
version = "0.1.0"
description = "Single-pass uncertainty firewall for LLM outputs. Uses calibrated token entropy profiles to flag risky generations."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Heman10x-NGU"}
]
keywords = ["llm", "hallucination", "detection", "entropy", "uncertainty", "ai-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
openai = [
    "openai>=1.0.0",
]
huggingface = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
]
eval = [
    "scikit-learn>=1.2.0",
]
all = [
    "openai>=1.0.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "scikit-learn>=1.2.0",
]

[project.scripts]
sentinel = "hallucination_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
